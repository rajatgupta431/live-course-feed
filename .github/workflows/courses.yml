name: Update Masterscave course feed
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Read the courses with a headless browser
        run: node scrape.js https://www.masterscave.in/courses > courses.new.json && mv courses.new.json courses.json
      - name: Save courses.json if it changed
        run: |
          git config user.name "course-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add courses.json
          git diff --cached --quiet || (git commit -m "Update course feed" && git push)
